<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE0B5">
<title>Happy Birthday 🎂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-step="3" data-shot="shot1">

<div id="field"></div>

<main class="page">
  <div class="packrow">
    <img class="pack" src="cadbury-shots.jpg" alt="Cadbury Shots">
    <div class="packtext">
      <div class="chip" data-t="shot1.chip"></div>
      <h1 class="h2" data-t="shot1.title"></h1>
    </div>
  </div>

  <div class="stage">
    <button class="choco-btn" id="choco" type="button" aria-label="Tap the chocolate">
      <span class="glow"></span>
      <span class="choco"></span>
      <span class="choco-shadow"></span>
      <span class="sp s1">✨</span><span class="sp s2">✨</span><span class="sp s3">✨</span>
    </button>

    <div class="card" id="card">
      <span class="tape"></span>
      <h2 data-t="shot1.popTitle"></h2>
      <p class="msg" data-t="shot1.msg"></p>
      <p class="sub" data-t="shot1.sub"></p>
      <span class="doodle">🌻</span>
    </div>
  </div>

  <p class="tap-hint" id="tapHint" data-t="shot1.tap"></p>
  <a class="btn go reveal" id="next" href="shot2.html" data-t="shot1.button"></a>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
